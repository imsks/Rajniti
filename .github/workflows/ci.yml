name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Tests
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Unit tests
        run: pytest tests/unit/ -v -n auto
        env:
          FLASK_ENV: testing
          TESTING: "true"

      - name: Integration tests
        run: pytest tests/integration/ -v
        env:
          FLASK_ENV: testing
          TESTING: "true"

      - name: E2E tests
        run: pytest tests/e2e/ -v
        env:
          FLASK_ENV: testing
          TESTING: "true"

  frontend-tests:
    name: Frontend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Integration tests
        run: npm run test:integration
        env:
          CI: true

      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true
          NEXTAUTH_SECRET: ci-playwright-e2e-secret-min-32-chars-long
          NEXTAUTH_URL: http://127.0.0.1:3000
          ENABLE_TEST_AUTH: "true"
          NEXT_PUBLIC_ENABLE_TEST_AUTH: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

  # ---------------------------------------------------------------------------
  # Stage 2 — Lint and others
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — lint
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black isort flake8 mypy

      - name: Black
        run: black --check app/ tests/

      - name: isort
        run: isort --check-only app/ tests/

      - name: Flake8
        run: flake8 app/ tests/

      - name: mypy
        run: mypy app/ --ignore-missing-imports

  frontend-lint:
    name: Frontend — lint & typecheck
    needs: frontend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend — production build
    needs: [frontend-tests, frontend-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
