# Local Postgres: use profile `local-db`. Supabase-only: omit the profile (API only).

services:
  postgres:
    image: postgres:16-alpine
    container_name: rajniti-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rajniti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rajniti}
      POSTGRES_DB: ${POSTGRES_DB:-rajniti}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - local-db

  rajniti-api:
    build:
      context: .
      target: development
    container_name: rajniti-api
    env_file:
      - .env
    ports:
      - "${FLASK_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./run.py:/app/run.py
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  postgres_data:
