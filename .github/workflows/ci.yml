name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: single job, sequential steps (lint → unit → integration → e2e)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — lint & tests (stepwise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist black isort flake8 mypy

      - name: "Step 1 — Lint (Black, isort, Flake8, mypy)"
        run: |
          black --check app/ tests/
          isort --check-only app/ tests/
          flake8 app/ tests/
          mypy app/ --ignore-missing-imports

      - name: "Step 2 — Unit tests"
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -n auto \
            --junitxml=test-results/unit-tests.xml
        env:
          FLASK_ENV: testing
          TESTING: "true"

      - name: "Step 3 — Integration tests"
        run: |
          pytest tests/integration/ -v \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/integration-tests.xml
        env:
          FLASK_ENV: testing
          TESTING: "true"

      - name: "Step 4 — E2E tests"
        run: |
          pytest tests/e2e/ -v \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/e2e-tests.xml
        env:
          FLASK_ENV: testing
          TESTING: "true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          name: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            test-results/
            htmlcov/

  # ---------------------------------------------------------------------------
  # Frontend: lint first, then unit / integration / E2E in parallel
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: Frontend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

  frontend-test-unit:
    name: Frontend — unit tests (Jest)
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
          JEST_JUNIT_OUTPUT_NAME: junit-unit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-results
          path: |
            frontend/coverage/
            frontend/junit-unit.xml

  frontend-test-integration:
    name: Frontend — integration tests (Jest)
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true
          JEST_JUNIT_OUTPUT_NAME: junit-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-integration-results
          path: frontend/junit-integration.xml

  frontend-test-e2e:
    name: Frontend — E2E (Playwright)
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          # NextAuth requires a secret when the app loads; CI-only placeholder.
          NEXTAUTH_SECRET: ci-playwright-e2e-secret-min-32-chars-long
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend-build:
    name: Frontend — production build
    runs-on: ubuntu-latest
    needs:
      - frontend-test-unit
      - frontend-test-integration
      - frontend-test-e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: frontend/.next/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security & Docker
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install safety bandit

      - name: Safety (dependency vulnerabilities)
        run: safety check -r requirements.txt --output json || true
        continue-on-error: true

      - name: Bandit (code security)
        run: bandit -r app/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  docker-build:
    name: Docker build (API image)
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rajniti-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Gate
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test
      - frontend-lint
      - frontend-test-unit
      - frontend-test-integration
      - frontend-test-e2e
      - frontend-build
      - security-scan
      - docker-build
    steps:
      - name: Check all jobs passed
        env:
          BACKEND: ${{ needs.backend-test.result }}
          FE_LINT: ${{ needs.frontend-lint.result }}
          FE_UNIT: ${{ needs.frontend-test-unit.result }}
          FE_INT: ${{ needs.frontend-test-integration.result }}
          FE_E2E: ${{ needs.frontend-test-e2e.result }}
          FE_BUILD: ${{ needs.frontend-build.result }}
          SEC: ${{ needs.security-scan.result }}
          DOCKER: ${{ needs.docker-build.result }}
        run: |
          ok() { [ "$1" = "success" ]; }
          if ! ok "$BACKEND" || ! ok "$FE_LINT" || ! ok "$FE_UNIT" || ! ok "$FE_INT" || ! ok "$FE_E2E" || ! ok "$FE_BUILD" || ! ok "$SEC" || ! ok "$DOCKER"; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All required checks passed."

      - name: Summary
        env:
          BACKEND: ${{ needs.backend-test.result }}
          FE_LINT: ${{ needs.frontend-lint.result }}
          FE_UNIT: ${{ needs.frontend-test-unit.result }}
          FE_INT: ${{ needs.frontend-test-integration.result }}
          FE_E2E: ${{ needs.frontend-test-e2e.result }}
          FE_BUILD: ${{ needs.frontend-build.result }}
          SEC: ${{ needs.security-scan.result }}
          DOCKER: ${{ needs.docker-build.result }}
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Backend (stepwise) | $BACKEND |"
            echo "| Frontend lint | $FE_LINT |"
            echo "| Frontend unit | $FE_UNIT |"
            echo "| Frontend integration | $FE_INT |"
            echo "| Frontend E2E | $FE_E2E |"
            echo "| Frontend build | $FE_BUILD |"
            echo "| Security scan | $SEC |"
            echo "| Docker build | $DOCKER |"
          } >> "$GITHUB_STEP_SUMMARY"
