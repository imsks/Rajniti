version: "3.8"

# =============================================================================
# LOCAL DEVELOPMENT DOCKER COMPOSE
# =============================================================================
# Usage:
#   With local postgres:  docker compose --profile local-db up -d --build
#   With Supabase:        docker compose up -d --build  (set DATABASE_URL in .env)
#
# Required .env vars:
#   DATABASE_URL=postgresql://rajniti:rajniti_dev@postgres:5432/rajniti  (for local-db)
#   DATABASE_URL=postgresql://...@pooler.supabase.com:6543/postgres      (for Supabase)
# =============================================================================

services:
    # Local PostgreSQL - only used with `--profile local-db`
    postgres:
        image: postgres:16-alpine
        container_name: rajniti-postgres
        environment:
            # Fixed credentials for local dev - must match DATABASE_URL
            POSTGRES_USER: rajniti
            POSTGRES_PASSWORD: rajniti_dev
            POSTGRES_DB: rajniti
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rajniti -d rajniti"]
            interval: 10s
            timeout: 5s
            retries: 5
        profiles:
            - local-db

    # Development API with hot reload
    rajniti-api:
        build:
            context: .
            target: development
        container_name: rajniti-api
        env_file:
            - .env
        environment:
            # DATABASE_URL from .env is used directly
            DATABASE_URL: ${DATABASE_URL}
        ports:
            - "${FLASK_PORT:-8000}:8000"
        volumes:
            # Mount code for hot reload in development
            - ./app:/app/app
            - ./run.py:/app/run.py
            - ./alembic.ini:/app/alembic.ini
            - ./alembic:/app/alembic
        depends_on:
            postgres:
                condition: service_healthy
                required: false
        restart: unless-stopped

volumes:
    postgres_data:
