version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: rajniti-postgres
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready"]
            interval: 10s
            timeout: 5s
            retries: 5
        profiles:
            - local-db

    # Development API with hot reload
    # Only needs DATABASE_URL in .env - works with local postgres or Supabase
    rajniti-api:
        build:
            context: .
            target: development
        container_name: rajniti-api
        env_file:
            - .env
        ports:
            - "${FLASK_PORT:-8000}:8000"
        volumes:
            # Mount code for hot reload in development
            - ./app:/app/app
            - ./run.py:/app/run.py
            - ./alembic.ini:/app/alembic.ini
            - ./alembic:/app/alembic
        # No depends_on - API works with whatever DATABASE_URL points to
        restart: unless-stopped

volumes:
    postgres_data:
