# Local dev backing infra only. The web + api processes run natively via
# `turbo run dev` (see root `pnpm dev`). This file provides stateful services.
#
#   pnpm dev                      -> starts chroma, then turbo run dev
#   docker compose up -d chroma   -> just the vector DB
#   docker compose --profile local-db up -d   -> also a local Postgres

services:
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: rajniti-chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rajniti-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rajniti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rajniti}
      POSTGRES_DB: ${POSTGRES_DB:-rajniti}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - local-db

volumes:
  chroma_data:
  postgres_data:
